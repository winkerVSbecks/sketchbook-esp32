; Every sketch in src/ is a self-contained translation unit that includes the
; shared headers in src/shared/. build_src_filter picks exactly one per
; environment. It is not optional — PlatformIO otherwise compiles every .cpp in
; src/ into a single binary and the duplicate setup()/loop() fail to link.
;
;   src/main.cpp             arc tiles, new composition every 8s
;   src/arc_tiles_shake.cpp  arc tiles, new composition when you shake the board
;   src/collapse.cpp         negative-space blinds that collapse under gravity
;   src/trochoidal_wave.cpp  stacked trochoidal waves, Atkinson-dithered
;   src/terminal_charts.cpp  a woven terminal of box-drawing chart glyphs
;   src/skeleton_line.cpp    rubber-banded disks joined by tendons
;
; Each sketch gets three environments: <name>_native (SDL window),
; <name>_esp32 (the board), and <name>_shot (headless, writes PNG frames to a
; directory so a render can be inspected without a window).

[base_native]
platform = native
build_type = debug
lib_deps = lovyan03/LovyanGFX
build_flags =
    -O0
    -xc++
    -std=c++14
    !sdl2-config --cflags --libs

; Headless capture. Same source, but panelBegin() skips lcd.init() and
; present() writes a PNG instead of blitting. -O2 because these runs render
; many frames and nothing is waiting on a debugger.
[base_shot]
platform = native
build_type = release
lib_deps = lovyan03/LovyanGFX
build_flags =
    -O2
    -xc++
    -std=c++14
    -DSKETCH_HEADLESS
    !sdl2-config --cflags --libs

[base_esp32]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
lib_deps = lovyan03/LovyanGFX
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
monitor_speed = 115200

; --- arc tiles (timer) ------------------------------------------------------
[env:native]
extends = base_native
build_src_filter = -<*> +<main.cpp>

[env:esp32]
extends = base_esp32
build_src_filter = -<*> +<main.cpp>

[env:arc_shot]
extends = base_shot
build_src_filter = -<*> +<main.cpp>

; --- arc tiles (shake) ------------------------------------------------------
[env:shake_native]
extends = base_native
build_src_filter = -<*> +<arc_tiles_shake.cpp>

[env:shake_esp32]
extends = base_esp32
build_src_filter = -<*> +<arc_tiles_shake.cpp>

[env:shake_shot]
extends = base_shot
build_src_filter = -<*> +<arc_tiles_shake.cpp>

; --- collapse ---------------------------------------------------------------
[env:collapse_native]
extends = base_native
build_src_filter = -<*> +<collapse.cpp>

[env:collapse_esp32]
extends = base_esp32
build_src_filter = -<*> +<collapse.cpp>

[env:collapse_shot]
extends = base_shot
build_src_filter = -<*> +<collapse.cpp>

; --- trochoidal wave --------------------------------------------------------
[env:wave_native]
extends = base_native
build_src_filter = -<*> +<trochoidal_wave.cpp>

[env:wave_esp32]
extends = base_esp32
build_src_filter = -<*> +<trochoidal_wave.cpp>

[env:wave_shot]
extends = base_shot
build_src_filter = -<*> +<trochoidal_wave.cpp>

; --- switcher ---------------------------------------------------------------
; Hosts every sketch in one binary; BOOT (GPIO0) cycles between them. It is the
; one env whose filter names a file that #includes the others, so the filter
; still compiles exactly one translation unit — see the header of switcher.cpp.
[env:switcher_native]
extends = base_native
build_src_filter = -<*> +<switcher.cpp>

[env:switcher_esp32]
extends = base_esp32
build_src_filter = -<*> +<switcher.cpp>

; A capture run has no button, so the headless build cycles on a frame count
; instead — which is what makes "all four still render from inside their
; namespaces" checkable rather than assumed.
[env:switcher_shot]
extends = base_shot
build_src_filter = -<*> +<switcher.cpp>

; --- skeleton line ----------------------------------------------------------
[env:skeleton_native]
extends = base_native
build_src_filter = -<*> +<skeleton_line.cpp>

[env:skeleton_esp32]
extends = base_esp32
build_src_filter = -<*> +<skeleton_line.cpp>

[env:skeleton_shot]
extends = base_shot
build_src_filter = -<*> +<skeleton_line.cpp>

; --- terminal charts --------------------------------------------------------
[env:charts_native]
extends = base_native
build_src_filter = -<*> +<terminal_charts.cpp>

[env:charts_esp32]
extends = base_esp32
build_src_filter = -<*> +<terminal_charts.cpp>

[env:charts_shot]
extends = base_shot
build_src_filter = -<*> +<terminal_charts.cpp>
