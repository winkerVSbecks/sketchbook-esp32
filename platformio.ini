; --- paint (t2) ---------------------------------------------------------------
; A finger-painting app for the touch boards: drag draws, a tap cycles the
; brush color. Touch-first, so its envs exist only for boards with a panel
; you can touch.
[env:paint_t2_native]
extends = native_t2
build_src_filter = -<*> +<paint.cpp>

[env:paint_t2]
extends = esp32_t2
build_src_filter = -<*> +<paint.cpp>

[env:paint_t2_shot]
extends = shot_t2
build_src_filter = -<*> +<paint.cpp>

; --- zhi (t2) -----------------------------------------------------------------
; Port of the zhi fxhash piece: five stacked checkerboard grids whose cells
; breathe. Not animated here — the playhead tracks the finger's x position,
; and a tap reseeds.
[env:zhi_t2_native]
extends = native_t2
build_src_filter = -<*> +<zhi.cpp>

[env:zhi_t2]
extends = esp32_t2
build_src_filter = -<*> +<zhi.cpp>

[env:zhi_t2_shot]
extends = shot_t2
build_src_filter = -<*> +<zhi.cpp>

; --- the core (a18) -------------------------------------------------------------
; Port of the-core.js: six nested isometric cubes shear open with a staggered
; bounce, gradient-filled per pixel with analytic edge coverage. Fully
; deterministic — no randomness, so nothing for RESET to vary. The glass is a
; jelly: tap replays the pop, holding shrinks the stack diagonally shut,
; release springs it back open on a damped spring. Everything comes to rest;
; idle frames don't render. Touch-first, so a18 (and the kids roster). On
; SDL: click = tap, press-and-hold = squish.
[env:core_a18_native]
extends = native_a18
build_src_filter = -<*> +<the_core.cpp>

; -O2 because the per-pixel composite runs every frame of the wobble — see
; [env:iso_rk]. The unflag is load-bearing: the Arduino builder appends its
; -Os AFTER build_flags, so without it -Os silently wins.
[env:core_a18]
extends = esp32_a18
build_src_filter = -<*> +<the_core.cpp>
build_unflags = -Os
build_flags =
    ${esp32_a18.build_flags}
    -O2

[env:core_a18_shot]
extends = shot_a18
build_src_filter = -<*> +<the_core.cpp>

; --- napoleon (a18) -------------------------------------------------------------
; Port of napoleon-theorem.js: Napoleon's theorem as a fidget. Drag the purple
; vertex handles and the outer equilateral triangles and their centroid
; triangle (always equilateral — the theorem) follow live; a quick tap on
; empty glass resets the layout. Deterministic — no randomness, nothing for a
; reseed to vary. Touch-first, so a18 only. On SDL the mouse is the finger.
[env:nap_a18_native]
extends = native_a18
build_src_filter = -<*> +<napoleon.cpp>

; -O2 because every drag frame re-scans fifteen wedgeline bounding boxes —
; see [env:iso_rk]. The unflag is load-bearing: the Arduino builder appends
; its -Os AFTER build_flags, so without it -Os silently wins.
[env:nap_a18]
extends = esp32_a18
build_src_filter = -<*> +<napoleon.cpp>
build_unflags = -Os
build_flags =
    ${esp32_a18.build_flags}
    -O2

[env:nap_a18_shot]
extends = shot_a18
build_src_filter = -<*> +<napoleon.cpp>

; --- kids switcher (t2, a18) ----------------------------------------------------
; paint + zhi + the core + napoleon in one binary for small hands: BOOT swaps
; between them, the glass belongs to whichever sketch is active (paint: drag
; draws / tap cycles the crayon / shake wipes; zhi: scrub / tap redraws; core:
; tap pops / hold shrinks shut / release springs open; napoleon: drag the
; vertex handles / tap empty glass resets). Touch-first like its sketches, so
; the touch boards only. Same include-in-namespace hosting as switcher.cpp —
; see the header of switcher_kids.cpp for why this one must NOT read taps
; itself. Device envs carry the -O2 unflag because they host the core's
; per-pixel wobble — see [env:iso_rk].
;
; On the a18 there is no RESET button, and the usual tap-as-reseed stand-in is
; spoken for (the sketches own the glass) — so the fresh-composition gesture
; there is BOOT twice: swap away and back, and the re-entered setup() draws
; from a new seed.
[env:kids_t2_native]
extends = native_t2
build_src_filter = -<*> +<switcher_kids.cpp>

[env:kids_t2]
extends = esp32_t2
build_src_filter = -<*> +<switcher_kids.cpp>
build_unflags = -Os
build_flags =
    ${esp32_t2.build_flags}
    -O2

[env:kids_t2_shot]
extends = shot_t2
build_src_filter = -<*> +<switcher_kids.cpp>

[env:kids_a18_native]
extends = native_a18
build_src_filter = -<*> +<switcher_kids.cpp>

[env:kids_a18]
extends = esp32_a18
build_src_filter = -<*> +<switcher_kids.cpp>
build_unflags = -Os
build_flags =
    ${esp32_a18.build_flags}
    -O2

[env:kids_a18_shot]
extends = shot_a18
build_src_filter = -<*> +<switcher_kids.cpp>

; --- zhi knob (rk) ------------------------------------------------------------
; The same piece as zhi.cpp on a different instrument: the encoder ring is the
; playhead (one revolution = one loop of the breath), a tap on the glass
; reseeds. Knob-first, so its envs exist only for the rotary board. On SDL the
; mouse drag is the knob; there is no reseed stand-in — relaunch the binary.
[env:zhi_rk_native]
extends = native_rk
build_src_filter = -<*> +<zhi_knob.cpp>

[env:zhi_rk]
extends = esp32_rk
build_src_filter = -<*> +<zhi_knob.cpp>

[env:zhi_rk_shot]
extends = shot_rk
build_src_filter = -<*> +<zhi_knob.cpp>

; --- isolines (rk) ------------------------------------------------------------
; Chromatic noise-field contours: marching squares over a simplex field,
; stroked in four time-offset passes (R, G, B, white) so the colours fringe
; like chromatic aberration. The knob is the playhead (one revolution = one
; loop, wrap seamless), tap reseeds the field. Knob-first, so rk only. On SDL
; the mouse drag is the knob; no reseed stand-in — relaunch the binary.
[env:iso_rk_native]
extends = native_rk
build_src_filter = -<*> +<isolines.cpp>

; -O2 because the Arduino core's default -Os leaves real time on the table in
; this sketch's per-pixel stroke loops, and the knob feels every millisecond.
; The unflag is load-bearing: the Arduino builder appends its -Os AFTER
; build_flags, so without it the command line reads "-O2 ... -Os" and -Os
; silently wins.
[env:iso_rk]
extends = esp32_rk
build_src_filter = -<*> +<isolines.cpp>
build_unflags = -Os
build_flags =
    ${esp32_rk.build_flags}
    -O2

[env:iso_rk_shot]
extends = shot_rk
build_src_filter = -<*> +<isolines.cpp>

; --- circle moire (rk) --------------------------------------------------------
; Nineteen concentric stripe rings, neighbours phase-inverted — a moire that
; the knob slides: a quarter revolution shifts the stripes one full period —
; four loops per turn, geared up because one period per turn crawled (wrap
; seamless). No randomness in the piece, so no tap and nothing for RESET to
; vary. Knob-first, so rk only. On SDL the mouse drag is the knob.
[env:moire_rk_native]
extends = native_rk
build_src_filter = -<*> +<circle_moire.cpp>

[env:moire_rk]
extends = esp32_rk
build_src_filter = -<*> +<circle_moire.cpp>

[env:moire_rk_shot]
extends = shot_rk
build_src_filter = -<*> +<circle_moire.cpp>

; --- chill wave (rk) ------------------------------------------------------------
; A paper-coloured wave squiggle on a random riso-ink field: the end caps sit
; at fixed x and the wave slides through them — crests travel, caps bob. The
; knob is the playhead, geared 4x (one revolution = four loops, wrap
; seamless — 1x crawled, 8x raced), tap redraws the colours (the piece's one
; random draw). Knob-first, so rk only. On SDL the mouse drag is the knob; no
; reseed stand-in — relaunch the binary.
[env:chill_rk_native]
extends = native_rk
build_src_filter = -<*> +<chill_wave.cpp>

[env:chill_rk]
extends = esp32_rk
build_src_filter = -<*> +<chill_wave.cpp>

[env:chill_rk_shot]
extends = shot_rk
build_src_filter = -<*> +<chill_wave.cpp>

; --- knob switcher (rk) ---------------------------------------------------------
; zhi knob + isolines + circle moire + chill wave in one binary: the knob's
; full-press (GPIO41) cycles between them, and the ring and glass belong to
; whichever sketch is active (each reads the encoder as its playhead; all but
; moire read a tap as reseed, which is why this switcher must NOT read taps
; itself — see the header of switcher_knob.cpp). Knob-first like its four
; sketches, so rk only. On SDL: drag = knob, bottom-strip click = next sketch.
[env:switcher_rk_native]
extends = native_rk
build_src_filter = -<*> +<switcher_knob.cpp>

; -O2 because this binary hosts isolines' per-pixel stroke loops — see
; [env:iso_rk]. The unflag is load-bearing: the Arduino builder appends its
; -Os AFTER build_flags, so without it the command line reads "-O2 ... -Os"
; and -Os silently wins.
[env:switcher_rk]
extends = esp32_rk
build_src_filter = -<*> +<switcher_knob.cpp>
build_unflags = -Os
build_flags =
    ${esp32_rk.build_flags}
    -O2

[env:switcher_rk_shot]
extends = shot_rk
build_src_filter = -<*> +<switcher_knob.cpp>

