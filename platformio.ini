; Two sketches share this project:
;   src/main.cpp              arc tiles, new composition every 8s
;   src/arc_tiles_shake.cpp   arc tiles, new composition when you shake the board
;
; build_src_filter picks exactly one per environment. It is not optional —
; PlatformIO otherwise compiles every .cpp in src/ into a single binary and the
; duplicate setup()/loop() fail to link.

[base_native]
platform = native
build_type = debug
lib_deps = lovyan03/LovyanGFX
build_flags =
    -O0
    -xc++
    -std=c++14
    !sdl2-config --cflags --libs

[base_esp32]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
lib_deps = lovyan03/LovyanGFX
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
monitor_speed = 115200

[env:native]
extends = base_native
build_src_filter = -<*> +<main.cpp>

[env:esp32]
extends = base_esp32
build_src_filter = -<*> +<main.cpp>

[env:shake_native]
extends = base_native
build_src_filter = -<*> +<arc_tiles_shake.cpp>

[env:shake_esp32]
extends = base_esp32
build_src_filter = -<*> +<arc_tiles_shake.cpp>
