; --- switcher ---------------------------------------------------------------
; Hosts every sketch in one binary; BOOT (GPIO0) cycles between them and RESET
; reseeds the one you are on. It is the one env whose filter names a file that
; #includes the others, so the filter still compiles exactly one translation
; unit — see the header of switcher.cpp.
[env:switcher_147_native]
extends = native_147
build_src_filter = -<*> +<switcher.cpp>

[env:switcher_147]
extends = esp32_147
build_src_filter = -<*> +<switcher.cpp>

; A capture run has no button, so the headless build cycles on a frame count
; instead — which is what makes "all five still render from inside their
; namespaces" checkable rather than assumed.
[env:switcher_147_shot]
extends = shot_147
build_src_filter = -<*> +<switcher.cpp>

[env:switcher_a18_native]
extends = native_a18
build_src_filter = -<*> +<switcher.cpp>

