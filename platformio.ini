; Every sketch in src/ is a self-contained translation unit that includes the
; shared headers in src/shared/. build_src_filter picks exactly one per
; environment. It is not optional — PlatformIO otherwise compiles every .cpp in
; src/ into a single binary and the duplicate setup()/loop() fail to link.
;
;   src/main.cpp             arc tiles, one still composition
;   src/arc_tiles_shake.cpp  arc tiles, new composition when you shake the board
;   src/collapse.cpp         negative-space blinds that collapse under gravity
;   src/trochoidal_wave.cpp  stacked trochoidal waves, Atkinson-dithered
;   src/terminal_charts.cpp  a woven terminal of box-drawing chart glyphs
;   src/skeleton_line.cpp    rubber-banded disks joined by tendons
;   src/jali_truchet.cpp     an arched jali window with tilt-driven parallax
;
; No sketch regenerates on a timer: a composition holds until you ask for
; another. On the board that ask is RESET; on SDL it is relaunching the binary.
;
; Environments are named <sketch>_<board> for the device build, plus
; <sketch>_<board>_native (SDL window) and <sketch>_<board>_shot (headless,
; writes PNG frames to a directory so a render can be inspected without a
; window). Two axes, composed from the sections below:
;
;   target   base_native / base_shot / base_esp32 — how it runs
;   board    -DBOARD_* flag picking a header in src/shared/boards/ — W/H, the
;            panel class, pins, and where the framebuffer lives
;
; Boards: 147 = Waveshare ESP32-S3-LCD-1.47B (172x320 ST7789 over SPI).
;         a18 = Waveshare ESP32-S3-Touch-AMOLED-1.8 V1 (368x448 SH8601 over QSPI).
;         t2  = Waveshare ESP32-S3-Touch-LCD-2 (240x320 ST7789T3 over SPI, CST816D touch).
;
; Native and headless are per-board too — W/H come from the board header, and a
; sketch has to be previewed and captured at the resolution it ships on. A
; sketch's envs for a board are written only once the sketch actually works at
; that board's dimensions: the env list IS the support matrix.

[base_native]
platform = native
build_type = debug
lib_deps = lovyan03/LovyanGFX
build_flags =
    -O0
    -xc++
    -std=c++14
    !sdl2-config --cflags --libs

; Headless capture. Same source, but panelBegin() skips lcd.init() and
; present() writes a PNG instead of blitting. -O2 because these runs render
; many frames and nothing is waiting on a debugger.
[base_shot]
platform = native
build_type = release
lib_deps = lovyan03/LovyanGFX
build_flags =
    -O2
    -xc++
    -std=c++14
    -DSKETCH_HEADLESS
    !sdl2-config --cflags --libs

[base_esp32]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
lib_deps = lovyan03/LovyanGFX
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
monitor_speed = 115200

; --- board 147: Waveshare ESP32-S3-LCD-1.47B --------------------------------
; The -DBOARD_LCD_147B is technically redundant — platform.h defaults to this
; board — but every env states its board so no build depends on the default.
[native_147]
extends = base_native
build_flags =
    ${base_native.build_flags}
    -DBOARD_LCD_147B

[shot_147]
extends = base_shot
build_flags =
    ${base_shot.build_flags}
    -DBOARD_LCD_147B

[esp32_147]
extends = base_esp32
build_flags =
    ${base_esp32.build_flags}
    -DBOARD_LCD_147B

; --- board a18: Waveshare ESP32-S3-Touch-AMOLED-1.8 --------------------------
; memory_type = qio_opi because the S3R8's PSRAM is octal and the devkitc-1
; board definition defaults to quad — and on this board the framebuffer
; *lives* in PSRAM, so PSRAM silently failing to init means a null sprite at
; boot, not a slowdown. (LovyanGFX's Panel_AMOLED family needs LGFX_USE_QSPI,
; but the library defines that itself on IDF >= 4.4 — don't add it here.)
[native_a18]
extends = base_native
build_flags =
    ${base_native.build_flags}
    -DBOARD_AMOLED_18

[shot_a18]
extends = base_shot
build_flags =
    ${base_shot.build_flags}
    -DBOARD_AMOLED_18

[esp32_a18]
extends = base_esp32
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
build_flags =
    ${base_esp32.build_flags}
    -DBOARD_AMOLED_18

; --- board t2: Waveshare ESP32-S3-Touch-LCD-2 --------------------------------
; Same qio_opi story as the a18: octal PSRAM, and the 150KB framebuffer lives
; there, so quad-init failing silently means a null sprite at boot.
[native_t2]
extends = base_native
build_flags =
    ${base_native.build_flags}
    -DBOARD_TOUCH_LCD_2

[shot_t2]
extends = base_shot
build_flags =
    ${base_shot.build_flags}
    -DBOARD_TOUCH_LCD_2

[esp32_t2]
extends = base_esp32
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
build_flags =
    ${base_esp32.build_flags}
    -DBOARD_TOUCH_LCD_2

; --- board diag -------------------------------------------------------------
; Calibration pattern + live IMU readout, for board bringup. Not art: flash it
; when a new board's panel geometry or accelerometer is in doubt.
[env:diag_a18]
extends = esp32_a18
build_src_filter = -<*> +<board_diag.cpp>

[env:diag_t2]
extends = esp32_t2
build_src_filter = -<*> +<board_diag.cpp>

